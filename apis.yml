apis:
- aid: anaconda:server-api
  name: Anaconda Server API
  description: The repository API behind the Anaconda Platform and the on-premises
    Anaconda Server — channels, artifacts (conda, PyPI, CRAN), subchannels, mirrors,
    installers, CVE and vulnerability metadata, accounts, users, groups, tokens, license
    and system administration. Published as OpenAPI 3.0.0 (version 6.5) with 129 paths
    and 172 operations, secured with a JWT bearer scheme and an X-Auth user-token API
    key.
  humanURL: https://anaconda.com/docs/anaconda-platform/main
  baseURL: https://api.anaconda.cloud/api
  tags:
  - Repository
  - Package Management
  - Channels
  - Artifacts
  - Vulnerabilities
  properties:
  - type: OpenAPI
    url: openapi/anaconda-server-openapi-original.json
  - type: Documentation
    url: https://anaconda.com/docs/anaconda-platform/main
- aid: anaconda:org-management-api
  name: Anaconda Organization Management API
  description: Administrative API for Anaconda Platform organizations — create and
    delete service accounts, add and remove users, assign and revoke subscription seats,
    onboard users in bulk, and create, update, list and revoke organization access
    tokens. OpenAPI 3.1.0, authenticated with a service-account client_credentials
    bearer token plus X-Org-Name and X-API-Version headers.
  humanURL: https://anaconda.com/docs/anaconda-platform/admin/org-management-api/org-management-api
  baseURL: https://anaconda.com
  tags:
  - Organizations
  - User Management
  - Provisioning
  - Tokens
  properties:
  - type: OpenAPI
    url: openapi/anaconda-org-management-openapi-original.json
  - type: APIReference
    url: https://anaconda.com/docs/anaconda-platform/admin/org-management-api/org-management-api
- aid: anaconda:audit-logs-api
  name: Anaconda Audit Logs API
  description: Read and export organization audit events from the Anaconda Platform.
    Supports listing audit logs with limit/offset/sort pagination, retrieving a single
    event, and creating asynchronous bulk export jobs that write JSON Lines files,
    with job-status polling and a signed download endpoint. OpenAPI 3.1.0.
  humanURL: https://anaconda.com/docs/anaconda-platform/admin/audit-logs/audit-log-api
  baseURL: https://anaconda.com
  tags:
  - Audit Logs
  - Compliance
  - Governance
  - Export
  properties:
  - type: OpenAPI
    url: openapi/anaconda-audit-logs-openapi-original.json
  - type: APIReference
    url: https://anaconda.com/docs/anaconda-platform/admin/audit-logs/audit-log-api
- aid: anaconda:ai-navigator-api
  name: Anaconda AI Navigator API
  description: Local HTTP API exposed by Anaconda AI Navigator for managing curated
    local models, model files, inference servers, and an embedded vector database —
    list and download models, start and stop model servers, and create, list and drop
    vector-database tables. OpenAPI 3.0.0 with a bearer (UUID API key) scheme; the
    server runs on the developer's own machine, so the specification publishes no
    servers[] entry.
  humanURL: https://anaconda.com/docs/api-reference/get-api
  x-baseURL-note: Local-only API. Anaconda publishes the OpenAPI with an empty servers[]
    array and documents no host/port, so no baseURL is asserted here rather than inventing
    one.
  tags:
  - Artificial Intelligence
  - Models
  - Inference
  - Vector Database
  properties:
  - type: OpenAPI
    url: openapi/anaconda-ai-navigator-openapi-original.json
  - type: APIReference
    url: https://anaconda.com/docs/api-reference/get-api
- aid: anaconda:desktop-api
  name: Anaconda Desktop API
  description: Local HTTP API exposed by Anaconda Desktop for model and inference-server
    management — list the model catalog, inspect and delete model files, track download
    status, and create, start, stop and delete local model servers. OpenAPI 3.0.0 with
    a bearer (UUID API key) scheme; runs on the developer's own machine so no servers[]
    host is published.
  humanURL: https://anaconda.com/docs/anaconda-desktop/main
  x-baseURL-note: Local-only API. Anaconda publishes the OpenAPI with an empty servers[]
    array and documents no host/port, so no baseURL is asserted here rather than inventing
    one.
  tags:
  - Desktop
  - Models
  - Inference
  - Artificial Intelligence
  properties:
  - type: OpenAPI
    url: openapi/anaconda-desktop-openapi-original.json
  - type: Documentation
    url: https://anaconda.com/docs/anaconda-desktop/main
- aid: anaconda:anaconda-org-api
  name: Anaconda.org Repository API
  description: The public REST API behind anaconda.org — the community package repository
    that serves conda and PyPI artifacts. Exposes user/organization profiles, packages,
    releases, files, labels and channels, and is the API the first-party anaconda-client
    library and `anaconda org` CLI plugin speak to. Anonymous reads are open; writes
    require an Anaconda.org token. No OpenAPI is published for this surface as of this
    profiling pass.
  humanURL: https://anaconda.com/docs/anaconda-org/main
  baseURL: https://api.anaconda.org
  tags:
  - Repository
  - Package Registry
  - Conda
  - PyPI
  properties:
  - type: Documentation
    url: https://anaconda.com/docs/anaconda-org/main
  - type: CLI
    url: https://anaconda.com/docs/cli-reference/anaconda-client/commands/index
- aid: anaconda:mcp
  name: Anaconda MCP
  description: Anaconda's Model Context Protocol surface for AI coding agents. `anaconda-mcp`
    is a unified local gateway that composes conda-aware MCP servers, giving Claude
    Desktop, Claude Code, Cursor, VS Code, OpenCode and Windsurf direct access to conda
    environments, installed packages, channel configuration and structured package
    metadata for real dependency resolution. `anaconda ai mcp` is a second server exposing
    the AI Navigator model and inference-server operations as MCP tools over stdio or
    streamable-http.
  humanURL: https://anaconda.com/docs/cli-reference/anaconda-mcp/getting-started
  x-baseURL-note: Locally hosted MCP servers (stdio by default; `anaconda ai mcp` also
    offers streamable-http on 127.0.0.1:8000). Anaconda publishes no remote/hosted MCP
    endpoint, so no baseURL is asserted here.
  tags:
  - MCP
  - Agents
  - Artificial Intelligence
  - Developer Tools
  properties:
  - type: MCPServer
    url: mcp/anaconda-mcp.yml
  - type: ToolCrosswalk
    url: mcp/anaconda-tool-crosswalk.yml
  - type: Documentation
    url: https://anaconda.com/docs/cli-reference/anaconda-mcp/getting-started

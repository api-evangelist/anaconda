apis:
- aid: anaconda:anaconda-org-api
  name: Anaconda.org Repository API
  description: >-
    The public REST API behind anaconda.org — the community package repository that serves conda and PyPI
    artifacts. Exposes user/organization profiles, packages, releases, files, labels and channels, and
    is the API the first-party anaconda-client library and `anaconda org` CLI plugin speak to. Anonymous
    reads are open; writes require an Anaconda.org token. No OpenAPI is published for this surface as
    of this profiling pass.
  humanURL: https://anaconda.com/docs/anaconda-org/main
  baseURL: https://api.anaconda.org
  tags:
  - Repository
  - Package Registry
  - Conda
  - PyPI
  properties:
  - type: Documentation
    url: https://anaconda.com/docs/anaconda-org/main
  - type: CLI
    url: https://anaconda.com/docs/cli-reference/anaconda-client/commands/index
- aid: anaconda:mcp
  name: Anaconda MCP
  description: >-
    Anaconda's Model Context Protocol surface for AI coding agents. `anaconda-mcp` is a unified local
    gateway that composes conda-aware MCP servers, giving Claude Desktop, Claude Code, Cursor, VS Code,
    OpenCode and Windsurf direct access to conda environments, installed packages, channel configuration
    and structured package metadata for real dependency resolution. `anaconda ai mcp` is a second server
    exposing the AI Navigator model and inference-server operations as MCP tools over stdio or streamable-http.
  humanURL: https://anaconda.com/docs/cli-reference/anaconda-mcp/getting-started
  x-baseURL-note: >-
    Locally hosted MCP servers (stdio by default; `anaconda ai mcp` also offers streamable-http on 127.0.0.1:8000).
    Anaconda publishes no remote/hosted MCP endpoint, so no baseURL is asserted here.
  tags:
  - MCP
  - Agents
  - Artificial Intelligence
  - Developer Tools
  properties:
  - type: MCPServer
    url: mcp/anaconda-mcp.yml
  - type: ToolCrosswalk
    url: mcp/anaconda-tool-crosswalk.yml
  - type: Documentation
    url: https://anaconda.com/docs/cli-reference/anaconda-mcp/getting-started

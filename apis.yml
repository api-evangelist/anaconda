aid: anaconda
name: Anaconda
description: 'Anaconda, Inc. is the Austin, Texas company behind the Anaconda Distribution
  of Python and R, the conda package manager ecosystem, and the anaconda.org package
  repository — the default supply chain for open-source data science and AI packages.
  Its commercial Anaconda Platform (formerly Anaconda Cloud / Anaconda Server) adds
  a curated, security-scanned package repository with CVE metadata, private channels,
  mirroring, organization and seat management, audit logging, an on-premises repository
  server, Anaconda Desktop and AI Navigator for running local models and vector databases,
  and Agent Studio. Anaconda publishes machine-readable OpenAPI for the Anaconda Server
  repository API, the Organization Management API, the Audit Logs API, and the local
  Desktop and AI Navigator APIs, ships first-party Python client libraries and a plugin-based
  `anaconda` CLI, and operates conda-aware MCP servers for AI coding agents.'

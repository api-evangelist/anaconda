name: anaconda
description: Anaconda ships a single `anaconda` CLI entrypoint (`anaconda-cli-base`)
  whose surface is assembled from installable plugins — `anaconda-auth` (identity and
  tokens), `anaconda-client` (anaconda.org repository operations, exposed under `anaconda
  org`), `anaconda-ai` (local models, inference servers and a vector database), and
  `anaconda-mcp` (MCP client wiring). `conda` itself remains the separate package/environment
  manager.
docs: https://anaconda.com/docs/cli-reference/main
install:
- method: conda
  command: conda install anaconda-cli-base
- method: pip
  command: pip install anaconda-cli-base
- method: plugin
  command: anaconda tools install <plugin>
  docs: https://anaconda.com/docs/cli-reference/anaconda-cli/tools
self_update: anaconda self-update
docs_self_update: https://anaconda.com/docs/cli-reference/anaconda-cli/self-update

key_flows:
- name: Authenticate and provision a repository token
  steps:
  - anaconda auth login
  - anaconda token install
  - anaconda auth whoami
- name: Publish a conda package to a channel
  steps:
  - anaconda org login
  - anaconda org upload <package-file>
  - anaconda org label --copy main <channel>
- name: Run a local model and expose it to an agent
  steps:
  - anaconda ai download <model>
  - anaconda ai launch <model>
  - anaconda ai mcp --transport streamable-http --port 9000

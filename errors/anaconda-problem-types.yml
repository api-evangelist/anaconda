gaps:
- Two incompatible error envelopes across the estate (flat `{code,message,status}`
  on the repository API vs nested `{error:{code,message,data}}` on the Platform admin
  APIs).
- No RFC 9457 `application/problem+json` anywhere.
- No published registry of the `code` values either envelope can return, so an agent
  cannot branch on error code without trial and error.

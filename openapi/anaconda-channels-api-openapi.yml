        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - jwt: []
      - user_token: []
  /channels/{channel_name}/subchannels/{subchannel_name}/mirrors/{mirror_id}:
    get:
      tags:
      - channels
      summary: Show mirror details in subchannel
      operationId: repo.endpoints.channels.subchannel_mirrors.get_mirror
      parameters:
      - $ref: '#/components/parameters/channel-parameter'
      - $ref: '#/components/parameters/subchannel-parameter'
      - $ref: '#/components/parameters/mirror_id-parameter'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mirror'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - jwt: []
      - user_token: []
    put:
      tags:
      - channels
      summary: Update a mirror in subchannel
      operationId: repo.endpoints.channels.subchannel_mirrors.put_mirror
      parameters:
      - $ref: '#/components/parameters/channel-parameter'
      - $ref: '#/components/parameters/subchannel-parameter'
      - $ref: '#/components/parameters/mirror_id-parameter'
      - $ref: '#/components/parameters/task-manager-schedule-query'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorConfiguration'
      responses:
        '202':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mirror'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':

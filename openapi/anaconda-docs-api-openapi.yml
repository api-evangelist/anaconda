openapi: 3.2.0
info:
  version: '6.5'
  title: Anaconda Server Docs API
servers:
- url: https://api.anaconda.cloud/api
tags:
- name: Docs
paths:
  /external-docs:
    get:
      tags:
      - Docs
      summary: Redirect a user to the right documentation location
      operationId: repo.endpoints.system.get_external_docs
      responses:
        '302':
          description: redirect to the current documentation of Anaconda Server
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: repo.auth.token_provider.decode_token
    user_token:
      type: apiKey
      name: X-Auth
      in: header
      x-apikeyInfoFunc: repo.auth.token_provider.decode_user_private_token
x-provenance:
  method: harvested
  publisher: Anaconda
  source: https://api.anaconda.cloud/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
